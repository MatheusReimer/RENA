<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="RENA">
  <!--
    The brand mark, not the wordmark.

    This replaces a "V" left over from when the product was called Revy. The
    wordmark is RE-NA split by a glowing red dot, and at 16px in a browser tab
    four letters are mush while a single mark reads instantly -- which is the
    same reasoning that made every badge a circle.

    The gradient is `--accent-lit` from tokens.css, inlined because an SVG
    served from /public has no access to the stylesheet. Highlight at 35%/30%,
    accent through the middle, shade at the edge: the dot reads as lit from
    above rather than as a flat circle.
  -->
  <defs>
    <radialGradient id="lit" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff8a7d"/>
      <stop offset="55%" stop-color="#e8352b"/>
      <stop offset="100%" stop-color="#7d1611"/>
    </radialGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#0a0a0c"/>
  <circle cx="16" cy="16" r="7.5" fill="url(#lit)"/>
</svg>
