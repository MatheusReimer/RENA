<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="RENA">
  <!--
    The brand mark, not the wordmark.

    Replaces a "V" left from when the product was called Revy. The wordmark is
    RE NA split by a glowing red dot, and at 16px in a browser tab four letters
    are mush while one mark reads instantly. Same reasoning as the circular
    badges.

    The gradient is the accent-lit token from tokens.css, inlined because an
    SVG served from /public cannot reach the stylesheet. Highlight at 35%/30%,
    accent through the middle, shade at the edge, so it reads as lit from above
    rather than as a flat circle.

    NOTE: this is XML, so a comment may never contain two consecutive hyphens.
    An earlier version of this file wrote the CSS custom property with its
    leading hyphens and the whole SVG failed to parse, which the browser showed
    as the previous favicon rather than as an error.
  -->
  <defs>
    <radialGradient id="lit" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff8095"/>
      <stop offset="55%" stop-color="#c8102e"/>
      <stop offset="100%" stop-color="#5e0816"/>
    </radialGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#0a0a0c"/>
  <circle cx="16" cy="16" r="7.5" fill="url(#lit)"/>
</svg>
